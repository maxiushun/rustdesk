name: Windows 完整版客户端
on:
  workflow_dispatch:

jobs:
  build-windows-full:
    runs-on: windows-2022
    env:
      # 切换为静态库+动态CRT架构，和Rust默认环境完美匹配
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_DISABLE_BASELINE_CHECK: true
      RUST_BACKTRACE: full
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG: true

    steps:
      - name: 拉取完整源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 MSVC 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 更新 vcpkg 版本库
        run: |
          cd C:\vcpkg
          git pull
          .\bootstrap-vcpkg.bat -disableMetrics
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: 自动安装全部依赖（读取项目 vcpkg.json）
        run: C:\vcpkg\vcpkg.exe install --triplet x64-windows-static-md
        working-directory: ${{ github.workspace }}

      - name: 安装 Flutter SDK（匹配官方版本）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          architecture: x64

      - name: 启用 Windows 桌面构建
        run: |
          flutter config --enable-windows-desktop
          flutter doctor

      - name: 构建 Rust 核心库
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: 0
          # 对应新架构的静态库搜索路径
          RUSTFLAGS: "-L C:\\vcpkg\\installed\\x64-windows-static-md\\lib"
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          API_SERVER: ${{ secrets.API_SERVER }}

      - name: 构建 Flutter 前端并打包
        run: |
          cd flutter
          flutter build windows --release
          copy ..\target\release\rustdesk.exe build\windows\runner\Release\

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-完整版-windows-x64
          path: flutter/build/windows/runner/Release/rustdesk.exe
