name: Windows 完整版客户端
on:
  workflow_dispatch:

jobs:
  build-windows-full:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      RUST_BACKTRACE: full
    steps:
      - name: 拉取完整源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 MSVC 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 加载官方预编译vcpkg依赖
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/vcpkg_x64-windows-static.zip" -OutFile "vcpkg_deps.zip"
          Expand-Archive -Path "vcpkg_deps.zip" -DestinationPath "C:\" -Force
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: 安装 Flutter SDK（匹配官方版本）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          architecture: x64

      - name: 启用 Windows 桌面构建
        run: |
          flutter config --enable-windows-desktop
          flutter doctor

      - name: 构建 Rust 核心库
        run: cargo build --release
        env:
          VCPKG_ROOT: C:\vcpkg
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}
          API_SERVER: ${{ secrets.API_SERVER }}

      - name: 构建 Flutter 前端并打包
        run: |
          cd flutter
          flutter build windows --release
          copy ..\target\release\rustdesk.exe build\windows\runner\Release\

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-完整版-windows-x64
          path: flutter/build/windows/runner/Release/rustdesk.exe
