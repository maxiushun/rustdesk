name: 纯被控精简版编译
on:
  workflow_dispatch:

jobs:
  build-windows-headless:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 vcpkg 依赖
        run: |
          vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: 编译纯被控端
        run: cargo build --release --features headless
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-被控端-windows
          path: target/release/rustdesk.exe
