name: Windows纯被控精简版
on:
  workflow_dispatch:

jobs:
  build-windows-headless:
    runs-on: windows-latest
    steps:
      - name: 拉取完整源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 加载官方预编译依赖
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/nightly/vcpkg_x64-windows-static.zip" -OutFile "vcpkg_deps.zip"
          Expand-Archive -Path "vcpkg_deps.zip" -DestinationPath "C:\" -Force
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-windows-static" >> $env:GITHUB_ENV

      - name: 编译纯被控端
        run: cargo build --release --features headless
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-被控端-windows-x64
          path: target/release/rustdesk.exe
