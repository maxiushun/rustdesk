name: Windows纯被控精简版
on:
  workflow_dispatch:

jobs:
  build-windows-headless:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 初始化 vcpkg 环境
        run: |
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: 安装被控端依赖
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows-static libvpx libyuv opus

      - name: 编译纯被控端
        run: cargo build --release --features headless
        env:
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}
          RENDEZVOUS_SERVER: ${{ secrets.RENDEZVOUS_SERVER }}

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-被控端-windows-x64
          path: target/release/rustdesk.exe
